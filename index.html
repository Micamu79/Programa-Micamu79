<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Programa Micamu79</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#20252b;color:white;padding:22px 16px}
header h1{margin:0;font-size:25px}
header p{margin:6px 0 0;font-size:13px;opacity:.8}
main{max-width:760px;margin:auto;padding:12px}
.card{background:white;border:1px solid #e1e4e8;border-radius:16px;padding:15px;margin:12px 0;box-shadow:0 2px 8px rgba(0,0,0,.04)}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:16px;margin:0 0 10px}
.days{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}
button,select,input{font:inherit}
button,select,input{width:100%;padding:10px;border-radius:10px;border:1px solid #d9dde2;background:white}
button{background:#20252b;color:white;font-weight:600;border:0}
.days button{background:white;color:#18202a;border:1px solid #ddd}
.days button.active{background:#20252b;color:white}
.row{display:grid;grid-template-columns:1fr 88px;gap:7px;margin:7px 0}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.macro{background:#f1f3f5;border-radius:10px;padding:9px 4px;text-align:center;font-size:11px;color:#69717a}
.macro b{display:block;font-size:16px;color:#18202a;margin-bottom:2px}
.small{font-size:12px;color:#6b7280;line-height:1.4}
.notice{padding:11px;border-radius:10px;margin-top:10px;font-size:13px;line-height:1.45}
.ok{background:#edf8f1;color:#176b40}
.warn{background:#fff6da;color:#8a6100}
.bad{background:#ffefed;color:#a52218}
button.adjust{margin-top:4px}
footer{font-size:11px;color:#707780;padding:10px 3px 30px;line-height:1.45}
@media(max-width:430px){
 .grid{gap:4px}
 .macro b{font-size:14px}
}
</style>
</head>
