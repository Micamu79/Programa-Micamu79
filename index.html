<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Nutrición y Deporte</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background-color: #f4f7f6;
      color: #333;
    }

    .card {
      background: #ffffff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #2c3e50;
    }

    .btn-add {
      background-color: #27ae60;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 10px;
      transition: background 0.2s;
    }

    .btn-add:hover {
      background-color: #219150;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      background: #eef2f5;
      margin: 8px 0;
      padding: 10px 15px;
      border-left: 4px solid #27ae60;
      border-radius: 3px;
    }

    .empty-msg {
      color: #7f8c8d;
      font-style: italic;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏋️ Recomendación Post-Entreno</h2>
    <p>Según tu actividad reciente, necesitas recuperar energía:</p>
    
    <p><strong>Alimento:</strong> <span id="alimento-nombre">Avena con Proteína</span></p>
    <p><strong>Cantidad recomendada:</strong> <span id="alimento-cantidad">75</span> gramos</p>

    <button class="btn-add" onclick="agregarAlMenu()">➕ Añadir al menú del día</button>
  </div>

  <div class="card">
    <h2>🥗 Menú del Día</h2>
    <ul id="lista-menu">
      <li id="mensaje-vacio" class="empty-msg">Aún no has añadido alimentos al menú.</li>
    </ul>
  </div>

  <script>
    function agregarAlMenu() {
      // 1. Obtener los elementos de la sugerencia
      const alimento = document.getElementById('alimento-nombre').innerText;
      const cantidad = document.getElementById('alimento-cantidad').innerText;
      const lista = document.getElementById('lista-menu');
      const mensajeVacio = document.getElementById('mensaje-vacio');

      // 2. Si es el primer alimento, quitamos el mensaje de "Menú vacío"
      if (mensajeVacio) {
        mensajeVacio.remove();
      }

      // 3. Crear el nuevo elemento de la lista
      const nuevoItem = document.createElement('li');
      nuevoItem.innerHTML = `<strong>${alimento}</strong> - ${cantidad}g <small style="color: #7f8c8d;">(Añadido desde Deporte)</small>`;

      // 4. Insertar en el menú del día
      lista.appendChild(nuevoItem);
    }
  </script>

</body>
</html>
